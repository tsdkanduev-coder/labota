name: LabotaCalendarPreview

options:
  bundleIdPrefix: ai.labota
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  LabotaCalendarPreview:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Calendar Preview
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.labota.CalendarPreview
        PRODUCT_NAME: LabotaCalendarPreview
        INFOPLIST_FILE: Sources/Info.plist
