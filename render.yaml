services:
  - type: web
    name: openclaw
    runtime: docker
    plan: starter
    dockerCommand: /app/scripts/render-gateway-start.sh
    healthCheckPath: /
    envVars:
      - key: OPENCLAW_HOME
        value: /data
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_MAX_OLD_SPACE_MB
        value: "384"
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
